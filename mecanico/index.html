<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      var t = localStorage.getItem("bassoco_theme");
      if (t !== "dark") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  })();
</script>
<title>Team Bassoco — Mecánicos</title>
<meta name="description" content="Acceso de mecánicos de Team Bassoco Grupo Automotor Integrado.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../assets/icon.png">
<link rel="apple-touch-icon" href="../assets/icon.png">
<meta name="theme-color" content="#b1b4b3">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.min.css?v=20">
</head>
<body data-page="mecanico">

<div class="shell" style="max-width:640px;">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><img id="brand-logo-img" src="../assets/logo-black.png" alt="Team Bassoco Grupo Automotor Integrado"></div>
      <div class="brand-name">Mecánicos</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
      <div class="topbar-controls">
        <button class="icon-btn" id="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
      </div>
      <button class="btn btn-outline btn-sm" id="btn-salir" style="display:none;">Cerrar sesión</button>
    </div>
  </div>

  <div id="content">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>

  <div class="footer-note">Team Bassoco · Mecánicos</div>
</div>

<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">‹</button>
  <img id="lightbox-img" src="" alt="Foto ampliada">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script src="mecanico.min.js?v=2"></script>
</body>
</html>
